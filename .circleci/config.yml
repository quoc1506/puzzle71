version: 2.1

jobs:
  puzzle-worker:
    docker:
      - image: ubuntu:24.04

    steps:
      - checkout

      - run:
          name: Install dependencies
          command: |
            set -e

            apt-get update

            DEBIAN_FRONTEND=noninteractive apt-get install -y \
              git \
              g++ \
              make \
              autoconf \
              automake \
              libtool \
              pkg-config \
              libcurl4-openssl-dev \
              libssl-dev

      - run:
          name: Build libsecp256k1 and puzzle71_solver
          command: |
            set -e

            rm -rf /tmp/secp256k1
            rm -rf /tmp/secp256k1-install

            git clone --depth 1 \
              https://github.com/bitcoin-core/secp256k1.git \
              /tmp/secp256k1

            cd /tmp/secp256k1

            ./autogen.sh

            ./configure \
              --prefix=/tmp/secp256k1-install

            make -j"$(nproc)"
            make install

            cd "$CIRCLE_WORKING_DIRECTORY"

            g++ -O3 \
              -std=c++17 \
              -pthread \
              -I/tmp/secp256k1-install/include \
              -L/tmp/secp256k1-install/lib \
              -o puzzle71_solver \
              puzzle71_solver.cpp \
              -lsecp256k1 \
              -lcurl \
              -lssl \
              -lcrypto \
              -Wl,-rpath,/tmp/secp256k1-install/lib

            chmod +x puzzle71_solver

            echo "Build successful"
            file ./puzzle71_solver

      - run:
          name: Run puzzle worker
          no_output_timeout: 340m
          command: |
            set -e

            ./puzzle71_solver \
              --puzzle 71 \
              --user "ci-nguyenlinh6605-${CIRCLE_BUILD_NUM}" \
              --workers max

workflows:
  puzzle-worker:
    jobs:
      - puzzle-worker:
          filters:
            branches:
              only:
                - master